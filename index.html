<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GS Baseball Fundraisers</title>
<meta name="description" content="Support GS Baseball: sign up for our fundraisers.">
<meta name="theme-color" content="#0B2753">
<link rel="icon" href="img/icon-192.png">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@400;500;600;700&family=Graduate&display=swap" rel="stylesheet">
<style>
  :root{--ground:#E8ECF2;--surface:#FFFFFF;--surface-2:#F2F5F9;--ink:#0B1C3D;--ink-2:#4A5874;--line:#D4DBE6;
    --navy:#0B2753;--navy-2:#12336A;--carolina:#6DA0D6;--accent:#245FA8;--accent-soft:#DCE8F6;--bad:#C3392D;--cut:10px;
    --display:"Graduate","Rockwell","Roboto Slab",Georgia,serif;--body:"Barlow Semi Condensed","Arial Narrow","Helvetica Neue",system-ui,sans-serif}
  *{box-sizing:border-box}
  html{background:var(--navy)}
  body{margin:0;background:var(--ground);color:var(--ink);font:17px/1.45 var(--body);padding:0 0 48px;min-height:100vh}
  header{background:var(--navy);color:#fff;text-align:center;padding:calc(28px + env(safe-area-inset-top,0px)) 16px 34px;margin-bottom:-14px;
    clip-path:polygon(0 0,100% 0,100% calc(100% - 22px),calc(100% - 22px) 100%,22px 100%,0 calc(100% - 22px));border-bottom:4px solid var(--carolina)}
  header img{width:118px;height:auto;display:block;margin:0 auto 12px;filter:drop-shadow(0 4px 10px rgba(0,0,0,.35))}
  .badge{display:inline-block;background:var(--carolina);color:var(--navy);font:15px var(--display);letter-spacing:.08em;padding:5px 14px;text-transform:uppercase;
    clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px)}
  h1{font:clamp(30px,8.5vw,46px)/1.05 var(--display);text-transform:uppercase;margin:14px 0 10px;letter-spacing:.01em}
  h1 span{color:var(--carolina)}
  header p{color:#C9D6EA;margin:0 auto;max-width:440px}
  form{max-width:640px;margin:0 auto;padding:30px 16px 0}
  fieldset{border:1px solid var(--line);background:var(--surface);padding:30px 16px 6px;margin:0 0 18px;position:relative;
    clip-path:polygon(var(--cut) 0,100% 0,100% calc(100% - var(--cut)),calc(100% - var(--cut)) 100%,0 100%,0 var(--cut));box-shadow:0 1px 0 rgba(11,28,61,.04)}
  legend{position:absolute;top:0;left:0;background:var(--navy);color:#fff;font:14px var(--display);letter-spacing:.08em;text-transform:uppercase;padding:5px 14px 5px 18px;
    clip-path:polygon(var(--cut) 0,100% 0,calc(100% - 10px) 100%,0 100%,0 var(--cut))}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media(max-width:520px){.row{grid-template-columns:1fr}}
  label{display:block;font-size:15px;font-weight:700;margin-bottom:14px;color:var(--ink)}
  label small{font-weight:500;color:var(--ink-2)}
  input,select,textarea{width:100%;margin-top:6px;background:var(--surface-2);border:1px solid var(--line);color:var(--ink);border-radius:6px;padding:12px;font:17px var(--body);-webkit-appearance:none;appearance:none}
  select{background-image:linear-gradient(45deg,transparent 50%,var(--accent) 50%),linear-gradient(135deg,var(--accent) 50%,transparent 50%);background-position:calc(100% - 18px) 55%,calc(100% - 12px) 55%;background-size:6px 6px;background-repeat:no-repeat;padding-right:32px}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);border-color:transparent;background-color:#fff}
  textarea{min-height:84px;resize:vertical}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 16px}
  .chips label{margin:0;font-weight:600}
  .chips input{display:none}
  .chips span{display:inline-block;min-width:48px;text-align:center;padding:8px 12px;border:1px solid var(--line);background:var(--surface-2);cursor:pointer;font-size:15px;
    clip-path:polygon(6px 0,100% 0,100% calc(100% - 6px),calc(100% - 6px) 100%,0 100%,0 6px)}
  .chips input:checked+span{background:var(--navy);color:#fff;border-color:var(--navy)}
  .check{display:flex;gap:10px;align-items:flex-start;font-weight:500}
  .check input{width:22px;height:22px;margin:1px 0 0;flex:none;accent-color:var(--accent);-webkit-appearance:checkbox;appearance:auto}
  button{width:100%;background:var(--accent);color:#fff;border:0;padding:17px;font:20px var(--display);letter-spacing:.06em;text-transform:uppercase;cursor:pointer;
    clip-path:polygon(var(--cut) 0,100% 0,100% calc(100% - var(--cut)),calc(100% - var(--cut)) 100%,0 100%,0 var(--cut))}
  button:active{background:var(--navy)}
  button:disabled{opacity:.6}
  .msg{max-width:640px;margin:14px auto 0;padding:0 16px;text-align:center;color:var(--bad);font-weight:600;min-height:1.5em}
  .done{display:none;max-width:560px;margin:44px auto;text-align:center;background:var(--surface);border-top:4px solid var(--carolina);padding:34px 20px;
    clip-path:polygon(var(--cut) 0,100% 0,100% calc(100% - var(--cut)),calc(100% - var(--cut)) 100%,0 100%,0 var(--cut))}
  .done h2{font:30px var(--display);text-transform:uppercase;color:var(--navy);margin:0 0 8px}
  .done .ball{font-size:40px;margin-bottom:6px}
  footer{text-align:center;color:var(--ink-2);font-size:14px;margin-top:22px}
  .hp{position:absolute;left:-9999px}
  .note{margin:-4px 0 14px;padding:10px 12px;border-radius:6px;font-size:15px;font-weight:600;background:var(--accent-soft);color:var(--navy)}
  .note.bad{background:#FBE4E1;color:#8E2219}
  .list{max-width:640px;margin:0 auto;padding:30px 16px 0;display:grid;gap:14px}
  .item{display:flex;gap:14px;align-items:center;text-decoration:none;color:var(--ink);background:var(--surface);border:1px solid var(--line);padding:18px 16px;
    clip-path:polygon(var(--cut) 0,100% 0,100% calc(100% - var(--cut)),calc(100% - var(--cut)) 100%,0 100%,0 var(--cut))}
  .item .ico{font-size:34px}
  .item b{display:block;font:20px var(--display);text-transform:uppercase;color:var(--navy)}
  .item small{color:var(--ink-2);font-size:15px}
  .item .go{margin-left:auto;font:22px var(--display);color:var(--accent)}
</style>

</head>
<body>
<header>
  <img src="img/gs-logo.png" alt="GS">
  <div class="badge">Support the team</div>
  <h1><span>GS Baseball</span><br>Fundraisers</h1>
</header>
<!-- Add a fundraiser: make a folder (e.g. raffle/index.html) and add a link below. -->
<main class="list">
  <a class="item" href="softball/"><span class="ico">🥎</span><span><b>Slow Pitch Softball</b><small>Enter a team or sign up to play</small></span><span class="go">›</span></a>
</main>
<footer>GS Baseball · Thank you for your support!</footer>
</body>
</html>
